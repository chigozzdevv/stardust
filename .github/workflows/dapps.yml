name: Dapps

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      dapps:
        description: Dapps to run, separated by spaces, for example "blend". Empty runs every dapp in tests/dapps/.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: dapps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dapps:
    name: Stardust on real dapps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Stardust on the dapps
        env:
          DAPPS: ${{ inputs.dapps }}
        run: |
          read -ra dapps <<< "$DAPPS"
          pnpm test:dapps "${dapps[@]}"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dapps-results
          path: tests/dapps/.checkouts/*/stardust-results/
          include-hidden-files: true
          if-no-files-found: ignore
