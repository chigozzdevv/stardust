name: Conformance

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario files to run, separated by spaces, for example "submit-token.spec.ts network-details.spec.ts". Empty runs every file.
        type: string
        default: ''
      grep:
        description: Run only the scenarios whose title matches this regular expression (Playwright --grep).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  varial:
    name: Stardust against the real Varial extension
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CONFORMANCE_RECORD: '1'
      INDEXER_URL: ${{ secrets.INDEXER_URL }}
      INDEXER_V2_URL: ${{ secrets.INDEXER_V2_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Yarn for the Varial build
        run: corepack enable yarn

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Compare Stardust with Varial
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          GREP: ${{ inputs.grep }}
        run: |
          read -ra args <<< "$SCENARIOS"
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          pnpm test:conformance "${args[@]}"

      - name: Upload recorded Varial replies
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: varial-replies
          path: tests/fixtures/varial/

      - name: Upload conformance results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: conformance/stardust-results/
