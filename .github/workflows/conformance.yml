name: Conformance

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  varial:
    name: Stardust against the real Varial extension
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CONFORMANCE_RECORD: '1'
      INDEXER_URL: ${{ secrets.INDEXER_URL }}
      INDEXER_V2_URL: ${{ secrets.INDEXER_V2_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Yarn for the Varial build
        run: corepack enable yarn

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Compare Stardust with Varial
        run: pnpm test:conformance

      - name: Upload recorded Varial replies
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: varial-replies
          path: tests/fixtures/varial/

      - name: Upload conformance results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: conformance/stardust-results/
